# ===
# ЯКОРЯ
# ===
x-kafka-consumer-env: &kafka-consumer-env
  KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BROKERS}"
  KAFKA_BROKERS: "${KAFKA_BROKERS}"

# Общий блок environment для топика transactions.
x-transactions-topic-env: &transactions-topic-env
  KAFKA_TRANSACTIONS_TOPIC: "${TRANSACTIONS_TOPIC}"

# Ограничение логов, чтобы json-логи не разрослись на диске.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }


# ===
# Сервисы
# ===

services:

  zookeeper:
    image: "${ZOOKEEPER_IMAGE}"
    networks:
      - ml-scorer
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_HOST_PORT}:2181"
    logging: *logging

  kafka:
    image: "${KAFKA_IMAGE}"
    depends_on:
      - zookeeper
    networks:
      - ml-scorer
    ports:
      - "${KAFKA_HOST_PORT}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "${ZOOKEEPER_CONNECT}"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://${KAFKA_BROKERS},PLAINTEXT_HOST://${KAFKA_HOST_BROKERS}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 10
    logging: *logging

  db:
    image: "${POSTGRES_IMAGE}"
    restart: unless-stopped
    networks:
      - ml-scorer
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${PG_USER}"
      POSTGRES_DB: "${PG_DB}"
      TZ: Europe/Moscow
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "log_min_duration_statement=500"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging

  # Сервис для создания топиков при старте
  kafka-setup:
    image: "${KAFKA_IMAGE}"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - ml-scorer
    restart: on-failure
    entrypoint: [ "/bin/bash", "-c" ]
    command: |
      "
      echo 'Ожидание готовности Kafka...'
      while ! kafka-topics --bootstrap-server ${KAFKA_BROKERS} --list; do
        sleep 1
      done

      echo 'Создание топиков...'
      kafka-topics --bootstrap-server ${KAFKA_BROKERS} --create --if-not-exists --topic ${TRANSACTIONS_TOPIC} --partitions 3 --replication-factor 1 --config retention.ms=604800000
      kafka-topics --bootstrap-server ${KAFKA_BROKERS} --create --if-not-exists --topic ${SCORING_TOPIC} --partitions 3 --replication-factor 1 --config retention.ms=604800000

      echo 'Топики успешно созданы:'
      kafka-topics --bootstrap-server ${KAFKA_BROKERS} --list
      "

  kafka-ui:
    image: "${KAFKA_UI_IMAGE}"
    depends_on:
      - kafka
    networks:
      - ml-scorer
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "${KAFKA_BROKERS}"
      KAFKA_CLUSTERS_0_ZOOKEEPER: "${ZOOKEEPER_CONNECT}"
    logging: *logging

  fraud_detector:
    build: ./fraud_detector
    networks:
      - ml-scorer
    environment:
      <<: [*kafka-consumer-env, *transactions-topic-env]
      KAFKA_SCORING_TOPIC: "${SCORING_TOPIC}"
      SCORER_GROUP_ID: "${SCORER_GROUP_ID}"
    volumes:
      - ./fraud_detector/train_data:/app/train_data
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  postgres-logger:
    build: ./postgres-logger
    networks:
      - ml-scorer
    env_file:
      - path: ./postgres-logger/.env
        required: false
    environment:
      <<: *kafka-consumer-env
      KAFKA_SCORING_TOPIC: "${SCORING_TOPIC}"
      WRITER_BATCH_SIZE: "${WRITER_BATCH_SIZE}"
      WRITER_BATCH_TIMEOUT_S: "${WRITER_BATCH_TIMEOUT_S}"
      WRITER_GROUP_ID: "${WRITER_GROUP_ID}"
      POSTGRES_HOST: db
      POSTGRES_PORT: "${PG_PORT}"
      POSTGRES_USER: "${PG_USER}"
      POSTGRES_DB: "${PG_DB}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy
      
    restart: unless-stopped
    logging: *logging

  interface:
    build: ./interface
    networks:
      - ml-scorer
    environment:
      <<: [*kafka-consumer-env, *transactions-topic-env]
      POSTGRES_HOST: db
      POSTGRES_PORT: "${PG_PORT}"
      POSTGRES_USER: "${PG_USER}"
      POSTGRES_DB: "${PG_DB}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${INTERFACE_PORT}:8501"
    logging: *logging

networks:
  ml-scorer:
    name: ml-scorer
    driver: bridge

volumes:
  pgdata:
